general {
    # run hyprlock whenever hypridle receives a lock event
    lock_cmd         = pidof hyprlock || hyprlock
    # lock screen before suspend (via systemd)
    before_sleep_cmd = loginctl lock-session
    # restore DPMS after resume
    after_sleep_cmd  = hyprctl dispatch dpms on
    # optionally wait for lock before sleeping
    inhibit_sleep    = 3
}

listener {
    timeout = 300				# 5min.
    on-timeout = brightnessctl -s set 10	# set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r		# monitor backlight restore.
}

listener {
    timeout = 600				# 10min
    on-timeout = pidof hyprlock || hyprlock	# lock screen when timeout has passed
}

listener {
    timeout = 900                                # 15min
    on-timeout = hyprctl dispatch dpms off       # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on         # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1200                                # 20min
    on-timeout = systemctl suspend                # suspend pc
}
