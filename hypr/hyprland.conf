### MONITORS ###
monitor = eDP-1, 1920x1080@144, 0x0, 1
monitor = HDMI-A-1, 1920x1080@60, 1920x0, 1

### MY PROGRAMS ###
$terminal = /home/cybi/.config/scripts/start-terminal.sh
$fileManager = nemo
$menu = rofi -show drun -theme $HOME/.config/rofi/launchers/type-1/style-6.rasi

### AUTOSTART ###
exec-once = nm-applet
exec-once = waybar
exec-once = dunst
exec-once = wlsunset -L 44.44 -l 26.10 -t 4000 -T 6000
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = hyprpaper
exec-once = hypridle
exec-once = ghostty --gtk-single-instance=true --quit-after-last-window-closed=false --initial-window=false
### NOTE: make it so that it purges once 10 mins or so
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data


### ENVIRONMENT VARIABLES ###
env = GBM_BACKEND, nvidia-drm
env = LIBVA_DRIVER_NAME, nvidia
env = __GLX_VENDOR_LIBRARY_NAME, nvidia

env = __GL_GSYNC_ALLOWED, 1
env = __GL_VRR_ALLOWED, 0

env = __GL_MaxFramesAllowed,1

env = WLR_RENDERER_ALLOW_SOFTWARE,1

env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto

env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11,*

env = WLR_NO_HARDWARE_CURSORS, 1
env = HYPRCURSOR_SIZE,24
env = XCURSOR_SIZE,24

env = GDK_SCALE, 1
# env = QT_QPA_PLATFORMTHEME, qt6ct
env = XDG_SESSION_TYPE, wayland

xwayland {
  force_zero_scaling = true
}

### LOOK AND FEEL ###
general {
    gaps_in = 0
    gaps_out = 0

    border_size = 1

    col.active_border = rgba(8292c4aa) rgba(536067aa) 135deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = true
    allow_tearing = true
    layout = master
    # layout = dwindle
}

decoration {
    rounding = 0
    shadow:enabled = false
    blur {
	enabled = false
    }
}

animations {
    enabled = false
}

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

master {
    new_status = master
    mfact = 0.5125
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    vrr = 0
    vfr = true
    mouse_move_enables_dpms = true
}

render {
    direct_scanout = true
    explicit_sync = true
    # explicit_sync_kms = 1
    explicit_sync_kms = 0
}

### INPUT ###
input {
    kb_layout = us,ro
    kb_options=grp:win_space_toggle
    follow_mouse = 1
    repeat_rate = 35
    repeat_delay = 500
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    accel_profile = "adaptive"
    force_no_accel = true

    touchpad {
	natural_scroll = true
    }
}

cursor {
    no_hardware_cursors = true
    # no_break_fs_vrr = true
}

gestures {
    workspace_swipe = true
}

$touchpad_en = true

device {
    # name = epic-mouse-v1
    name = syna32a4:00-06cb:ce17-touchpad
    enabled = $touchpad_en
}

####################
###### MEDIA #######
####################

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# Requires playerctl
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next
#requires brightnessctl
bindl = , XF86MonBrightnessUp, exec, brightnessctl set 10%+
bindl = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

### KEYBINDINGSS ###

$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy && wtype -M ctrl shift -P v -m ctrl
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, D, exec, $menu
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod, L, exec, hyprlock
bind = $mainMod SHIFT, L, exit,
bind = $mainMod SHIFT, SPACE, togglefloating,
bind = $mainMod, F, fullscreen
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod SHIFT, Pause, exec, /home/cybi/.config/hypr/disable_mouse.sh
bind = $mainMod SHIFT, S, exec, hyprshot -m region

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrulev2 = stayfocused, title:^()$,class:^(steam)$
windowrulev2 = minsize 1 1, title:^()$,class:^(steam)$

windowrulev2 = float,class:thunderbird,title:^(?!Mozilla*)
windowrulev2 = move 100%-w-20 5%, class:(thunderbird), title: ()

windowrulev2 = float, title:^(Picture-in-Picture|Firefox)$
windowrulev2 = size 800 450, title:^(Picture-in-Picture|Firefox)$
windowrulev2 = pin, title:^(Picture-in-Picture|Firefox)$

windowrulev2 = float, title:rofi

windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.

ecosystem:no_update_news = true

